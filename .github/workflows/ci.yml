name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  airflow-3-provider:
    name: Airflow 3.3.1 provider and DAG
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      AIRFLOW_HOME: ${{ github.workspace }}/.airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__UNIT_TEST_MODE: "True"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install pinned Airflow and evidence core
        run: |
          python -m pip install \
            "apache-airflow==3.3.1" \
            --constraint \
            "https://raw.githubusercontent.com/apache/airflow/constraints-3.3.1/constraints-3.11.txt"
          python -m pip install --require-hashes \
            -r constraints/liquilens-evidence-v0.14.0.txt
          python -m pip install --no-deps -e .
          python -m pip install \
            build==1.5.0 \
            jsonschema==4.26.0 \
            pytest==9.1.1 \
            ruff==0.16.4 \
            twine==7.0.0
      - name: Verify core artifact provenance
        run: python -m scripts.check_core_provenance
      - name: Static checks
        run: |
          ruff check .
          ruff format --check .
      - name: Provider unit and policy tests
        run: pytest
      - name: Build and inspect distributions
        run: |
          source_date_epoch="$(git show -s --format=%ct HEAD)"
          SOURCE_DATE_EPOCH="$source_date_epoch" python -m build
          python -m twine check dist/*
      - name: Airflow discovery and real DAG task
        run: |
          airflow db migrate
          python -m scripts.check_provider_discovery
          python -m scripts.run_dag_smoke

